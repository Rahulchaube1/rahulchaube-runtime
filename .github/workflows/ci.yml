name: RahulChaube Runtime CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-matrix:
    name: Test & Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Unit & Integration Test Suite
        run: bun test tests/

      - name: Run Compatibility Matrix Command
        run: bun run packages/rahulchaube-cli/src/index.ts compatibility

      - name: Run Stress Tests
        run: bun test tests/stress.test.ts

      - name: Run Crash Resilience Tests
        run: bun test tests/crash.test.ts

      - name: Run Real Benchmarks
        run: bun run benchmarks/runner.ts

  build-release:
    name: Generate Binary Release Artifacts
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Generate Release Artifacts
        run: bun run installer/build-release.ts

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rahulchaube-release-artifacts
          path: dist/

  clean-room-installer-test:
    name: Clean-Room Installer Test (${{ matrix.os }})
    needs: build-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Test Windows Self-Contained Installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:Path = "$HOME\.rahulchaube\bin;" + $env:Path
          irm https://www.rahulchaube.space/install.ps1 | iex
          rahulchaube --help
          rahulchaube --version
          rahulchaube doctor
          rahulchaube create http-api demo

      - name: Test POSIX Self-Contained Installer (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://www.rahulchaube.space/install | bash
          export PATH="$HOME/.rahulchaube/bin:$PATH"
          rahulchaube --help
          rahulchaube --version
          rahulchaube doctor
