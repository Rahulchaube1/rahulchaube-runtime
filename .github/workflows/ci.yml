name: RahulChaube Runtime CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  native:
    name: Compile and exercise Blyx on ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: windows-latest, target: win-x64, suffix: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Rahulchaube1/blyxxxx
          ref: 2b6bd149ee898e05bb4b4e7f87e392baa7786071
          path: .blyx-compiler
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: cargo build --locked --release --manifest-path .blyx-compiler/Cargo.toml -p blyxc
      - run: bun installer/build-native.ts .blyx-compiler/target/release/blyxc${{ matrix.suffix }} packages/rahulchaube-cli/bin
      - run: bun test tests/native-cli.test.ts tests/live-runtime.test.ts tests/self-contained-installer.test.ts
        env:
          RAHUL_TEST_NATIVE: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.target }}
          path: |
            packages/rahulchaube-cli/bin/rahulchaube-native${{ matrix.suffix }}
            packages/rahulchaube-cli/bin/blyxc${{ matrix.suffix }}
          if-no-files-found: error

  editor-test:
    name: Verify published VSIX in desktop VS Code
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-linux-x64
          path: packages/rahulchaube-cli/bin
      - name: Run the extension against the compiled runtime
        run: |
          chmod +x packages/rahulchaube-cli/bin/rahulchaube-native packages/rahulchaube-cli/bin/blyxc
          (cd website/public/extensions && sha256sum --check SHA256SUMS)
          npm install --prefix "$RUNNER_TEMP/editor-test" --no-audit --no-fund @vscode/test-electron@3.1.0
          NODE_PATH="$RUNNER_TEMP/editor-test/node_modules" xvfb-run -a node editors/vscode/test/run.cjs

  test-matrix:
    name: Test & Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Run Unit & Integration Test Suite
        run: bun test tests/

      - name: Run Compatibility Matrix Command
        run: bun packages/rahulchaube-cli/bin/rahulchaube.ts compatibility

      - name: Run Stress Tests
        run: bun test tests/stress.test.ts

      - name: Run Crash Resilience Tests
        run: bun test tests/crash.test.ts

      - name: Run Real Benchmarks
        run: bun run benchmarks/runner.ts

  build-release:
    name: Generate Binary Release Artifacts
    needs: [test-matrix, native]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: .native-artifacts

      - name: Generate Release Artifacts
        run: bun run installer/build-release.ts

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rahulchaube-release-artifacts
          path: dist/

  clean-room-installer-test:
    name: Clean-Room Installer Test (${{ matrix.os }})
    needs: build-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rahulchaube-release-artifacts
          path: dist
      - name: Verify the generated release in a fresh install
        shell: bash
        run: |
          cp dist/version.json website/lib/release-manifest.json
          bun test tests/self-contained-installer.test.ts tests/verify-installer-output.test.ts
