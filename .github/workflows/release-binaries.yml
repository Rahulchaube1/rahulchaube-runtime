name: release-binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: rahulchaube-linux-x64
            os: ubuntu-latest
            artifact_name: rahulchaube-linux-x64.tar.gz
          - target: rahulchaube-linux-arm64
            os: ubuntu-latest
            artifact_name: rahulchaube-linux-arm64.tar.gz
          - target: rahulchaube-darwin-arm64
            os: macos-latest
            artifact_name: rahulchaube-darwin-arm64.tar.gz
          - target: rahulchaube-windows-x64
            os: windows-latest
            artifact_name: rahulchaube-windows-x64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build CLI Package
        run: |
          cd packages/rahulchaube-cli
          bun install
          bun run typecheck

      - name: Generate Binary Archive & Checksum
        shell: bash
        run: |
          mkdir -p dist
          echo "Building binary archive for ${{ matrix.target }}"
          echo "RahulChaube Runtime Binary Placeholder for ${{ matrix.target }}" > dist/rahulchaube
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a dist/${{ matrix.artifact_name }} dist/rahulchaube
          else
            tar -czf dist/${{ matrix.artifact_name }} -C dist rahulchaube
          fi
          cd dist
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  create-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
