name: release-binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Verify the version and checksums of the packaged release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$(bun -p 'require("./dist/version.json").version')"
          fi
          (cd dist && sha256sum --check SHA256SUMS)
          bun test tests/self-contained-installer.test.ts tests/verify-installer-output.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
      - name: Publish the verified tag artifacts
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
