name: release-binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: rahulchaube-linux-x64
            os: ubuntu-latest
            artifact_name: rahulchaube-linux-x64.tar.gz
          - target: rahulchaube-linux-arm64
            os: ubuntu-latest
            artifact_name: rahulchaube-linux-arm64.tar.gz
          - target: rahulchaube-darwin-x64
            os: macos-latest
            artifact_name: rahulchaube-darwin-x64.tar.gz
          - target: rahulchaube-darwin-arm64
            os: macos-latest
            artifact_name: rahulchaube-darwin-arm64.tar.gz
          - target: rahulchaube-windows-x64
            os: windows-latest
            artifact_name: rahulchaube-windows-x64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build CLI Package & Typecheck
        run: |
          cd packages/rahulchaube-cli
          bun install
          bun run typecheck

      - name: Bundle CLI Release Distribution & Generate Checksum
        shell: bash
        run: |
          mkdir -p dist/packages/rahulchaube-cli
          mkdir -p dist/bin

          cp -r packages/rahulchaube-cli/* dist/packages/rahulchaube-cli/

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cat << 'EOF' > dist/bin/rahulchaube.cmd
          @echo off
          setlocal enabledelayedexpansion
          set "INSTALL_DIR=%~dp0.."
          set "CLI_ENTRY=%INSTALL_DIR%\packages\rahulchaube-cli\bin\rahulchaube.ts"
          bun run "%CLI_ENTRY%" %*
          EOF
            cd dist
            7z a ${{ matrix.artifact_name }} bin packages
            sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          else
            cat << 'EOF' > dist/bin/rahulchaube
          #!/usr/bin/env bash
          INSTALL_DIR="$(cd "$(dirname "$0")/.." && pwd)"
          CLI_ENTRY="${INSTALL_DIR}/packages/rahulchaube-cli/bin/rahulchaube.ts"
          exec bun run "${CLI_ENTRY}" "$@"
          EOF
            chmod +x dist/bin/rahulchaube
            cd dist
            tar -czf ${{ matrix.artifact_name }} bin packages
            sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz* dist/*.zip*

  create-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release with Auto Changelog
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
