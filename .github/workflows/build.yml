name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-cli:
    name: Build & Typecheck CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Typecheck CLI
        working-directory: packages/rahulchaube-cli
        run: bun run typecheck
      - name: Smoke test CLI
        run: bun packages/rahulchaube-cli/bin/rahulchaube.ts --help

  build-website:
    name: Build Website App Router
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: website
        run: bun install
      - name: Build Next.js app
        working-directory: website
        run: bun run build

  test-api:
    name: Test API Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Run API unit tests
        run: bun test api/tests/health.test.ts
