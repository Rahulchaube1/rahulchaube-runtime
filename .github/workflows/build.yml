name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-cli:
    name: Build & Typecheck CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: packages/rahulchaube-cli
      - name: Typecheck CLI
        working-directory: packages/rahulchaube-cli
        run: bun run typecheck
      - name: Check types for the standalone starter
        run: packages/rahulchaube-cli/node_modules/.bin/tsc -p native/starter
      - name: Smoke test CLI
        run: bun packages/rahulchaube-cli/bin/rahulchaube.ts --help

  build-website:
    name: Build Website App Router
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify handbook links and run the published examples
        working-directory: website
        run: bun test tests/handbook.test.mjs
      - name: Build Next.js app
        working-directory: website
        run: bun run build

  test-api:
    name: Test API Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Run API unit tests
        run: bun test api/tests/health.test.ts
