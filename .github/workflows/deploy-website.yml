name: Verify production website

on:
  push:
    branches: [main]
    paths: ["website/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-production-website
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the Vercel deployment on the public domain
        shell: bash
        run: |
          for attempt in {1..36}; do
            if curl --max-time 8 -fsS "https://www.rahulchaube.space/api/health?build=$GITHUB_SHA" |
              jq -e --arg sha "$GITHUB_SHA" '.status == "healthy" and .commit == $sha' > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "The domain is not serving commit $GITHUB_SHA" >&2
          exit 1
