name: Publish RC Runtime editor extension
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Distribution channel (both publishes to the two editor registries)
        type: choice
        options: [both, marketplace, open-vsx, github]
        required: true
permissions:
  contents: read
jobs:
  github-release:
    if: github.ref == 'refs/heads/main' && inputs.registry == 'github'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: rc-editor-github-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare the verified editor release
        run: |
          version=$(node -p "require('./editors/vscode/package.json').version")
          filename="rahulchaube-runtime-$version.vsix"
          cd website/public/extensions
          sha256sum --check SHA256SUMS
          mkdir "$RUNNER_TEMP/editor-release"
          sha256sum "$filename" > "$RUNNER_TEMP/editor-release/SHA256SUMS"
          echo "EDITOR_VERSION=$version" >> "$GITHUB_ENV"
          echo "VSIX_NAME=$filename" >> "$GITHUB_ENV"
      - name: Publish the VSIX and checksum on GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: editor-v${{ env.EDITOR_VERSION }}
          name: RC Runtime editor extension ${{ env.EDITOR_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: 'false'
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            website/public/extensions/${{ env.VSIX_NAME }}
            ${{ runner.temp }}/editor-release/SHA256SUMS
          body: |
            Download the VSIX below. In VS Code, VSCodium or code-server, open Extensions and choose **Install from VSIX…**. To install from a terminal, run `code --install-extension ./${{ env.VSIX_NAME }}`, replacing `code` with `codium` or `code-server` for those editors.

            Install the native RC Runtime on the workspace machine. Open a saved JavaScript or TypeScript file to format, check, run, watch or test it from the Command Palette.

            [Editor handbook](https://www.rahulchaube.space/docs/editor) · [Native runtime downloads](https://www.rahulchaube.space/download) · [Rahul Chaube](https://github.com/Rahulchaube1)
      - name: Verify the public release files
        run: |
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/editor-v$EDITOR_VERSION"
          for file in "$VSIX_NAME" SHA256SUMS; do
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors "$base/$file" --output "$RUNNER_TEMP/$file"
          done
          cmp "$RUNNER_TEMP/editor-release/SHA256SUMS" "$RUNNER_TEMP/SHA256SUMS"
          (cd "$RUNNER_TEMP" && sha256sum --check SHA256SUMS)
  publish:
    if: github.ref == 'refs/heads/main' && inputs.registry != 'github'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        registry: ${{ fromJSON(inputs.registry == 'both' && '["marketplace","open-vsx"]' || format('["{0}"]', inputs.registry)) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify the distribution package
        run: |
          cd website/public/extensions
          sha256sum --check SHA256SUMS
          version=$(node -p "require('../../../editors/vscode/package.json').version")
          echo "EDITOR_VERSION=$version" >> "$GITHUB_ENV"
          echo "PACKAGE=$PWD/rahulchaube-runtime-$version.vsix" >> "$GITHUB_ENV"
      - name: Publish to Visual Studio Marketplace
        if: matrix.registry == 'marketplace'
        env:
          VSCE_PAT: >-
            ${{ secrets.VSCE_PAT || secrets.VS_MARKETPLACE_TOKEN || secrets.VSCE_TOKEN ||
                secrets.VSCODE_MARKETPLACE_TOKEN || secrets.VSCODE_MARKETPLACE_PAT }}
        run: |
          flags=()
          if [[ -z "$VSCE_PAT" ]]; then
            echo "Using the repository workflow identity for publisher RahulChaube."
            flags+=(--oidc)
          fi
          npx --yes @vscode/vsce@4.1.1 publish --skip-duplicate --packagePath "$PACKAGE" "${flags[@]}"
      - name: Publish to Open VSX
        if: matrix.registry == 'open-vsx'
        env:
          OVSX_PAT: >-
            ${{ secrets.OVSX_PAT || secrets.OPEN_VSX_TOKEN || secrets.OVSX_TOKEN ||
                secrets.OPEN_VSX_PAT || secrets.OPENVSX_TOKEN || secrets.OPENVSX_PAT }}
        run: |
          flags=()
          if [[ -z "$OVSX_PAT" ]]; then
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://open-vsx.org/api/RahulChaube/rahulchaube-runtime/latest)
            if [[ "$status" == 404 ]]; then
              echo "::error::First Open VSX release requires the namespace owner's OVSX_PAT in repository Actions secrets."
              exit 1
            fi
            [[ "$status" == 200 ]] || { echo "::error::Open VSX listing lookup returned HTTP $status."; exit 1; }
            flags+=(--trusted-publishing)
          else
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://open-vsx.org/api/RahulChaube)
            if [[ "$status" == 404 ]]; then
              npx --yes ovsx@1.4.0 create-namespace RahulChaube
            elif [[ "$status" != 200 ]]; then
              echo "::error::Open VSX namespace lookup returned HTTP $status."; exit 1
            fi
          fi
          npx --yes ovsx@1.4.0 publish --skip-duplicate "$PACKAGE" "${flags[@]}"
      - name: Check that users can download the published version
        env:
          REGISTRY: ${{ matrix.registry }}
        run: |
          if [[ "$REGISTRY" == marketplace ]]; then
            url="https://marketplace.visualstudio.com/_apis/public/gallery/publishers/RahulChaube/vsextensions/rahulchaube-runtime/$EDITOR_VERSION/vspackage"
          else
            metadata="https://open-vsx.org/api/RahulChaube/rahulchaube-runtime/$EDITOR_VERSION"
            curl --fail --silent --show-error --retry-all-errors --retry 12 --retry-delay 10 "$metadata" --output "$RUNNER_TEMP/listing.json"
            url=$(jq -er --arg version "$EDITOR_VERSION" 'select(.version == $version and (.namespace | ascii_downcase) == "rahulchaube" and .name == "rahulchaube-runtime") | .files.download' "$RUNNER_TEMP/listing.json")
            [[ "$url" == https://* ]] || exit 1
          fi
          curl --fail --location --silent --show-error --retry-all-errors --retry 12 --retry-delay 10 "$url" --output "$RUNNER_TEMP/public.vsix"
          python3 - <<'PYTHON'
          from zipfile import ZipFile
          from os import environ
          from pathlib import Path
          with ZipFile(Path(environ["RUNNER_TEMP"]) / "public.vsix") as live, ZipFile(environ["PACKAGE"]) as built:
              for file in built.namelist():
                  if file.startswith("extension/") and not file.endswith("/") and live.read(file) != built.read(file):
                      raise SystemExit("Published file differs from release: " + file)
          PYTHON
      - name: Explain publisher authorization failure
        if: failure()
        env:
          REGISTRY: ${{ matrix.registry }}
        run: |
          if [[ "$REGISTRY" == marketplace ]]; then
            echo 'For a 401, configure Trusted Publishing under publisher **RahulChaube** for repository **Rahulchaube1/rahulchaube-runtime**, workflow **publish-editor.yml**, branch **main**. This job uses repository-level secrets and no GitHub environment. A Marketplace Manage token in **VSCE_PAT** is also supported.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'For a first release, store a namespace-owner token in the repository Actions secret **OVSX_PAT**. The Open VSX account must accept the registry publisher agreement. Subsequent releases can use an Open VSX trusted publisher for this workflow.' >> "$GITHUB_STEP_SUMMARY"
          fi
