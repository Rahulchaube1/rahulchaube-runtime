apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahulchaube-website
  labels:
    app: rahulchaube-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rahulchaube-website
  template:
    metadata:
      labels:
        app: rahulchaube-website
    spec:
      containers:
        - name: website
          image: ghcr.io/rahulchaube/rahulchaube.space:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: rahulchaube-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
