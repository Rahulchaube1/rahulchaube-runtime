apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rahulchaube-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: rahulchaube.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rahulchaube-website
                port:
                  number: 80
